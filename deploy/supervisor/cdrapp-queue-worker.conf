; Template Supervisor pour garder le worker de queue Laravel actif en permanence.
;
; Installation sur la VM (Debian/Ubuntu) :
;   sudo apt install supervisor
;   sudo cp deploy/supervisor/cdrapp-queue-worker.conf /etc/supervisor/conf.d/
;   # Adapter les chemins /var/www/cdrapp_v2 et l'utilisateur "www-data" ci-dessous
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start cdrapp-queue-worker:*
;
; Vérifier l'état :
;   sudo supervisorctl status
;
; Voir les logs :
;   tail -f /var/www/cdrapp_v2/storage/logs/queue-worker.log

[program:cdrapp-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/cdrapp_v2/artisan queue:work database --sleep=3 --tries=1 --max-time=3600 --timeout=900
directory=/var/www/cdrapp_v2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/cdrapp_v2/storage/logs/queue-worker.log
stopwaitsecs=3600
